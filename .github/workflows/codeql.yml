name: "CodeQL Analysis"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run at 2:00 AM UTC every Monday
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL Security Scan
    uses: zopencommunity/meta/.github/workflows/codeql.yml@main
    with:
      languages: 'c-cpp'
      build-mode: 'none'
    permissions:
      actions: read
      contents: read
      security-events: write
